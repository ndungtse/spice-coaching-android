[project]
name = "chat-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Appium-Python-Client>=5.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chat-eval = "chat_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Stub local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "HF_TOKEN=stub-token-for-ci" >> local.properties

      - name: Assemble SDK
        run: ./gradlew :sdk-android:assembleDebug --no-daemon

      - name: Run SDK unit tests
        run: ./gradlew :sdk-android:test --no-daemon

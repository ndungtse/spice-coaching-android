# MicroCoaching Android SDK — dev secrets template
#
# Copy this file to local.properties and fill in your values.
# local.properties is gitignored — NEVER commit real credentials.
#
# Usage:
#   cp local.properties.example local.properties
#   # then edit local.properties with your real values

# ── Android SDK ───────────────────────────────────────────────────────────────
# Set automatically by Android Studio. Change this to match your machine.
sdk.dir=/path/to/Android/sdk

# ── Model Download ────────────────────────────────────────────────────────────
# HuggingFace Hub access token — required for gated models.
#
# Steps:
#   1. Create a token at https://huggingface.co/settings/tokens  (type: Read)
#   2. Request model access at https://huggingface.co/litert-community/Gemma3-1B-IT
#   3. Paste your token below
#
# Used by: sample app BuildConfig.HF_TOKEN → MicroCoachingSDK.Builder.huggingFaceToken()
HF_TOKEN=hf_your_token_here

# ── OpenTelemetry ─────────────────────────────────────────────────────────────
# Optional: export spans to a real OTel collector (SigNoz, Grafana Tempo, Jaeger, etc.)
# Leave these blank to use Logcat-only debug logging (always enabled in the sample app).
#
# SigNoz example:
#   OTEL_ENDPOINT=https://ingest.your-signoz.io
#   OTEL_TOKEN=your_signoz_access_token
#
# Grafana Cloud example:
#   OTEL_ENDPOINT=https://otlp-gateway-prod-us-east-0.grafana.net/otlp
#   OTEL_TOKEN=<instance_id>:<grafana_api_token>  (base64-encoded for Basic auth)
#
# Local SigNoz on emulator (localhost = 10.0.2.2 from emulator):
#   OTEL_ENDPOINT=http://10.0.2.2:4318
#   OTEL_TOKEN=
#
# Used by: sample app BuildConfig.OTEL_ENDPOINT / OTEL_TOKEN → TelemetryManager
OTEL_ENDPOINT=
OTEL_TOKEN=
